<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Performance Predictor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Student<span>AI</span>
    </div>

    <div class="nav-text">
        ML Powered Prediction
    </div>

</nav>


<main class="container">

    <section class="hero">

        <div class="badge">
            Machine Learning
        </div>

        <h1>
            Predict Student Performance
        </h1>

        <p>
            Enter the student's academic and demographic
            information to estimate their mathematics score
            using our trained machine learning model.
        </p>

    </section>


    <section class="form-card">

        <div class="form-title">

            <h2>
                Student Information
            </h2>

            <p>
                Please provide accurate information.
            </p>

        </div>


        <form
            action="/predict"
            method="POST"
        >

            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select
                        name="gender"
                        required
                    >

                        <option value="">
                            Select gender
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="male">
                            Male
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Race / Ethnicity
                    </label>

                    <select
                        name="race_ethnicity"
                        required
                    >

                        <option value="">
                            Select group
                        </option>

                        <option value="group A">
                            Group A
                        </option>

                        <option value="group B">
                            Group B
                        </option>

                        <option value="group C">
                            Group C
                        </option>

                        <option value="group D">
                            Group D
                        </option>

                        <option value="group E">
                            Group E
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Parental Education
                    </label>

                    <select
                        name="parental_level_of_education"
                        required
                    >

                        <option value="">
                            Select education
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Lunch
                    </label>

                    <select
                        name="lunch"
                        required
                    >

                        <option value="">
                            Select lunch type
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="free/reduced">
                            Free / Reduced
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Test Preparation
                    </label>

                    <select
                        name="test_preparation_course"
                        required
                    >

                        <option value="">
                            Select status
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Reading Score
                    </label>

                    <input
                        type="number"
                        name="reading_score"
                        min="0"
                        max="100"
                        placeholder="e.g. 72"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Writing Score
                    </label>

                    <input
                        type="number"
                        name="writing_score"
                        min="0"
                        max="100"
                        placeholder="e.g. 75"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="predict-btn"
            >
                Predict Math Score
            </button>

        </form>

    </section>

</main>

</body>

</html>
